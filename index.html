<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skryon - система защиты</title>
    <meta
      name="description"
      content="Skryon - тонкая система безопасности с пантерой как лицом бренда."
    />
    <link rel="icon" href="./assets/skryon-logo.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="header-brand" href="#" aria-label="Skryon">Skryon</a>
    </header>

    <main>
      <section class="hero" aria-label="Главный экран Skryon">
        <div class="hero-image" aria-hidden="true"></div>
        <div class="hero-wash" aria-hidden="true"></div>

        <div class="hero-content">
          <p class="eyebrow">Система защиты</p>
          <h1 class="hero-title" aria-label="Невидимый периметр">
            <span class="title-word">Невидимый</span>
            <span class="title-rail" aria-hidden="true">
              <span class="title-line"></span>
            </span>
            <span class="title-word title-word-tight">периметр</span>
          </h1>
          <p class="lead">
            Тихая система защиты, которая смотрит глубже: периметр, события и
            риски под одним проницательным контролем.
          </p>

          <div class="vpn-reminder" aria-label="Сигнал Skryon">
            <span class="vpn-mark" aria-hidden="true">
              <img src="./assets/skryon-logo.png" alt="" />
            </span>
            <span class="vpn-line" aria-hidden="true"></span>
            <span class="vpn-copy">
              <span>Защищённый туннель</span>
              <strong>Зашифрованный периметр</strong>
            </span>
          </div>

          <div class="hero-actions">
            <a class="button button-primary" href="mailto:security@skryon.app">
              Запросить доступ
            </a>
            <a class="button button-ghost" href="#vision">Посмотреть подход</a>
          </div>

          <div class="thin-signals" aria-label="Ключевые принципы Skryon">
            <span id="vision">Наблюдение</span>
            <span id="control">Контроль</span>
            <span id="response">Реакция</span>
          </div>
        </div>
      </section>

    </main>
  </body>
</html>
